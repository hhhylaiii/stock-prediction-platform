[project]
name = "stock-prediction-platform"
version = "0.1.0"
description = "Daily return, interval and probability predictions for Taiwan listed and OTC stocks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.4,<6",
    "django>=5.2,<6",
    "django-environ>=0.11",
    "djangorestframework>=3.15",
    "gunicorn>=23",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "celery-types>=0.22",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-django>=4.9",
    "responses>=0.25",
    "ruff>=0.7",
    "time-machine>=2.15",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "C4", "DTZ", "DJ", "PT", "RUF", "ERA"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/**" = ["S603", "S607"]
"config/settings/test.py" = ["S105"]
"**/migrations/**" = ["E501", "RUF012"]
"**/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
files = ["apps", "config", "scripts", "tests", "manage.py"]
exclude = ["/migrations/"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "spec8: one of the nine mandatory SPEC section 8 tests; must be listed in tests/spec8_manifest.txt",
    "slow: walk-forward or backfill runs on real data; local only",
    "e2e: Playwright browser tests against a live server",
    "live: calls real external APIs; never runs in CI",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
